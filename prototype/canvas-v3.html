<title>商境创作画布</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: dark studio shell — icon rail, full-bleed node canvas, compact inspector, bottom run queue. */
:root{
  --bg:#0B0D13; --panel:#11141C; --surface:#171B25; --surface-2:#1D2230; --surface-3:#232938;
  --line:#282F3F; --line-soft:#1F2532; --fg:#E8EBF2; --fg-dim:#A3ABBD; --fg-mute:#6E7689;
  --accent:#6366F1; --accent-soft:rgba(99,102,241,.16); --accent-line:rgba(99,102,241,.45);
  --ok:#22C55E; --run:#3B82F6; --warn:#F59E0B; --bad:#EF4444; --edge:#39415A;
  --ok-soft:rgba(34,197,94,.13); --run-soft:rgba(59,130,246,.14); --warn-soft:rgba(245,158,11,.13); --bad-soft:rgba(239,68,68,.13);
  --radius:12px; --radius-sm:8px;
  --shadow:0 12px 32px rgba(0,0,0,.38);
  color-scheme: dark;
  font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF0F4; --panel:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F7FA; --surface-3:#ECEEF4;
    --line:#DDE1E9; --line-soft:#E9ECF2; --fg:#1A1E29; --fg-dim:#596174; --fg-mute:#8B93A5;
    --accent:#565BE0; --accent-soft:rgba(86,91,224,.10); --accent-line:rgba(86,91,224,.4);
    --ok:#16A34A; --run:#2563EB; --warn:#D97706; --bad:#DC2626; --edge:#B9C0CE;
    --ok-soft:rgba(22,163,74,.10); --run-soft:rgba(37,99,235,.10); --warn-soft:rgba(217,119,6,.10); --bad-soft:rgba(220,38,38,.10);
    --shadow:0 12px 30px rgba(20,26,40,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF0F4; --panel:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F7FA; --surface-3:#ECEEF4;
  --line:#DDE1E9; --line-soft:#E9ECF2; --fg:#1A1E29; --fg-dim:#596174; --fg-mute:#8B93A5;
  --accent:#565BE0; --accent-soft:rgba(86,91,224,.10); --accent-line:rgba(86,91,224,.4);
  --ok:#16A34A; --run:#2563EB; --warn:#D97706; --bad:#DC2626; --edge:#B9C0CE;
  --ok-soft:rgba(22,163,74,.10); --run-soft:rgba(37,99,235,.10); --warn-soft:rgba(217,119,6,.10); --bad-soft:rgba(220,38,38,.10);
  --shadow:0 12px 30px rgba(20,26,40,.10);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  padding-block:12px;
  padding-left:max(12px, env(safe-area-inset-left, 0px));
  padding-right:max(12px, env(safe-area-inset-right, 0px));
  font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none !important}
.app{height:100%;display:grid;grid-template-columns:56px minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:var(--panel);border-right:1px solid var(--line-soft)}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8B5CF6);margin-bottom:10px;position:relative}
.logo::after{content:"";position:absolute;inset:9px;border:2px solid rgba(255,255,255,.85);border-radius:4px;transform:rotate(45deg)}
.rail-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--fg-mute)}
.rail-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.rail-btn:hover{background:var(--surface-2);color:var(--fg-dim)}
.rail-btn.on{background:var(--accent-soft);color:var(--accent)}
.rail-spacer{flex:1}

.shell{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:var(--panel);min-width:0}
.crumb{display:flex;flex-direction:column;min-width:0}
.crumb small{color:var(--fg-mute);font-size:11px;letter-spacing:.02em}
.crumb strong{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb strong span{color:var(--fg-mute);font-weight:400}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12px;color:var(--fg-dim);white-space:nowrap}
.seg button.on{background:var(--surface-3);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.cost{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-dim);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.cost b{color:var(--fg);font-weight:600}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--fg-dim);border:1px solid transparent}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--fg-dim)}

.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.canvas-wrap{position:relative;min-width:0;min-height:0;background:
  radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0) 0 0/22px 22px, var(--bg)}
.canvas-scroll{position:absolute;inset:0;overflow:auto}
.stage{position:relative;width:2100px;height:1400px;transform-origin:0 0}
#edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6}
.edge.hot{stroke:var(--accent);stroke-width:2}
.edge.run{stroke:var(--run);stroke-width:2;stroke-dasharray:7 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.node{position:absolute;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 20px rgba(0,0,0,.18);user-select:none}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 26px rgba(0,0,0,.25)}
.node header{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line-soft);cursor:grab}
.node header:active{cursor:grabbing}
.node .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.node .nt{font-size:12px;font-weight:600;letter-spacing:.01em}
.node .badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--fg-mute);white-space:nowrap}
.badge.queued{background:var(--surface-3);color:var(--fg-dim)}
.badge.running{background:var(--run-soft);border-color:transparent;color:var(--run)}
.badge.success{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.badge.failed{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.badge.waiting{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.badge.running .pdot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--run);margin-right:5px;animation:pulse 1.2s infinite;vertical-align:1px}
.nbody{padding:10px 11px 12px;display:flex;flex-direction:column;gap:8px}
.nthumb{height:96px;border-radius:8px;border:1px solid var(--line-soft);background:
  linear-gradient(135deg,rgba(99,102,241,.22),rgba(20,184,166,.12) 55%,rgba(245,158,11,.14));
  display:flex;align-items:flex-end;justify-content:space-between;padding:7px 9px;color:var(--fg-dim);font-size:10px}
.nthumb.plain{background:var(--surface-2);align-items:center;justify-content:center}
.nprompt{font-size:12px;color:var(--fg-dim);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.nmeta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--fg-mute);font-variant-numeric:tabular-nums}
.nmeta .pill{border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.port{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--fg-mute);cursor:crosshair;z-index:2}
.port:hover{border-color:var(--accent);transform:scale(1.15)}
.port.out{right:-6px}
.port.in{left:-6px}
.port.text{border-radius:3px;border-color:#A78BFA}
.port.image{border-color:#38BDF8}
.port.video{border-color:#EC4899}
.port span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--fg-mute);white-space:nowrap;opacity:0;transition:opacity .12s}
.node:hover .port span{opacity:1}

.palette{position:absolute;left:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow);width:150px}
.palette h4{margin:2px 4px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute)}
.pal-btn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:12px;color:var(--fg-dim);text-align:left}
.pal-btn:hover{background:var(--surface-2);color:var(--fg)}
.pal-btn i{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
.zoombar{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.zoombar button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--fg-dim)}
.zoombar button:hover{background:var(--surface-2);color:var(--fg)}
.zoombar span{font-size:11px;color:var(--fg-mute);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.canvas-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;color:var(--fg-mute);background:var(--panel);border:1px solid var(--line-soft);padding:4px 10px;border-radius:999px;pointer-events:none;opacity:.85}

.inspector{background:var(--panel);border-left:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0}
.insp-head{padding:13px 14px 11px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.insp-head .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.insp-head strong{font-size:13px}
.insp-head .badge{margin-left:auto}
.insp-body{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-mute)}
.field textarea,.field select,.field input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:12px;line-height:1.5;resize:vertical}
.field textarea:focus,.field select:focus,.field input:focus{outline:2px solid var(--accent-line);outline-offset:1px;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.adv{border-top:1px solid var(--line-soft);padding-top:8px}
details.adv summary{font-size:11px;color:var(--fg-mute);cursor:pointer;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv pre{margin:8px 0 0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:11px;color:var(--fg-dim);overflow:auto}
.insp-actions{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;gap:8px}
.btn{border-radius:9px;padding:8px 13px;font-size:12.5px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-dim)}
.btn:hover{border-color:var(--line);background:var(--surface-3);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:7px}
.insp-empty{padding:24px 16px;color:var(--fg-mute);font-size:12px;text-align:center}

.queue{border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);max-height:232px}
.queue-head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-soft)}
.queue-head h3{font-size:12px;margin:0;font-weight:600}
.queue-head .count{font-size:10.5px;color:var(--fg-mute);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.queue-head .grow{flex:1}
.queue-scroll{overflow:auto}
table.runs{width:100%;border-collapse:collapse;font-size:12px}
table.runs th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-mute);font-weight:500;padding:6px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.runs td{padding:7px 14px;border-bottom:1px solid var(--line-soft);color:var(--fg-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
table.runs tr{cursor:pointer}
table.runs tr:hover td{background:var(--surface-2)}
table.runs td.name{color:var(--fg);font-weight:500}
table.runs td.err{color:var(--bad);max-width:280px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.pill.queued{background:var(--surface-3);color:var(--fg-dim)}
.pill.running{background:var(--run-soft);color:var(--run)}
.pill.success{background:var(--ok-soft);color:var(--ok)}
.pill.failed{background:var(--bad-soft);color:var(--bad)}
.pill.cancelled{background:var(--surface-3);color:var(--fg-mute)}
.pill .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.running .d{animation:pulse 1.2s infinite}
.tlink{color:var(--accent);font-size:11px;padding:2px 4px;border-radius:4px}
.tlink:hover{background:var(--accent-soft)}

/* chat */
.chat{display:none;min-height:0;background:var(--bg)}
.shell.is-chat .workspace,.shell.is-chat .queue{display:none}
.shell.is-chat .chat{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0}
.chat-main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;border-right:1px solid var(--line-soft)}
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line-soft);background:var(--panel)}
.chat-top .prod{display:flex;align-items:center;gap:9px;min-width:0}
.chat-top .pthumb{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(20,184,166,.25));border:1px solid var(--line)}
.chat-top b{font-size:13px;display:block}
.chat-top small{color:var(--fg-mute);font-size:11px}
.chat-log{overflow:auto;padding:20px 18px 8px;display:flex;flex-direction:column;gap:16px;min-height:0}
.msg{display:flex;gap:10px;max-width:720px}
.msg .who{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--surface-3);color:var(--fg-dim)}
.msg.ai .who{background:var(--accent-soft);color:var(--accent)}
.msg .bubble{background:var(--surface);border:1px solid var(--line-soft);padding:10px 13px;border-radius:12px;border-top-left-radius:4px;font-size:13px;line-height:1.65;color:var(--fg-dim)}
.msg.me{flex-direction:row-reverse;align-self:flex-end}
.msg.me .bubble{background:var(--accent);border-color:transparent;color:#fff;border-top-left-radius:12px;border-top-right-radius:4px}
.msg .bubble b{color:var(--fg);font-weight:600}
.msg.me .bubble b{color:#fff}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.fact{font-size:11px;background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;color:var(--fg-dim)}
.fact em{font-style:normal;color:var(--fg-mute);margin-right:4px}
.attach{display:flex;gap:6px;margin-top:9px}
.attach .ph{width:56px;height:56px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(99,102,241,.2))}
.composer-wrap{padding:10px 18px 16px;background:var(--bg)}
.composer-wrap .composer{max-width:840px;margin:0 auto}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.composer textarea{background:none;border:0;resize:none;outline:none;padding:4px 6px;font-size:13px;line-height:1.6;min-height:24px;max-height:140px;color:var(--fg)}
.composer .crow{display:flex;align-items:center;gap:4px}
.composer .crow .grow{flex:1}
.composer .hint{font-size:10.5px;color:var(--fg-mute);margin-left:4px}
.chat-side{background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.chat-side h4{margin:0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-mute)}
.progress-list{display:flex;flex-direction:column;gap:7px}
.pitem{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-dim)}
.pitem .ok{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:var(--ok);flex:none}
.pitem .ok.fill{background:var(--ok-soft);border-color:transparent}
.plan-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.plan-card b{font-size:12px;display:block;margin-bottom:4px}
.plan-card p{margin:0;font-size:11.5px;color:var(--fg-mute);line-height:1.55}
.plan-card .btn{width:100%;margin-top:9px}
.chat-tip{font-size:11px;color:var(--fg-mute);line-height:1.55}

@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .workspace{grid-template-columns:1fr}
  .inspector{display:none}
  .queue{max-height:38vh}
  .shell.is-chat .chat{grid-template-columns:1fr}
  .chat-side{display:none}
  .palette{width:auto;left:10px;right:10px;top:10px;flex-direction:row;flex-wrap:wrap;gap:4px}
  .palette h4{display:none}
  .pal-btn{flex:1 0 30%;justify-content:center;padding:6px 4px;font-size:11px}
  .canvas-hint,.zoombar{display:none}
  .top-actions .cost{display:none}
  .crumb small{display:none}
  .crumb strong{max-width:42vw}
  #run-all{white-space:nowrap;padding:6px 9px;font-size:12px}
  .topbar{padding:8px 10px;gap:8px}
  .seg button{padding:5px 8px}
  .node{width:210px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>

<div class="app">
  <aside class="rail" aria-label="工作空间">
    <div class="logo" aria-hidden="true"></div>
    <button class="rail-btn" aria-label="工作台"><svg viewBox="0 0 24 24"><path d="M3 3h7v9H3zM14 3h7v5h-7zM3 16h7v5H3zM14 12h7v9h-7z"/></svg></button>
    <button class="rail-btn on" aria-label="项目"><svg viewBox="0 0 24 24"><path d="M4 5h6l2 3h8v11H4z"/></svg></button>
    <button class="rail-btn" aria-label="商品"><svg viewBox="0 0 24 24"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5zM4 8.5 12 13l8-4.5M12 13v7"/></svg></button>
    <button class="rail-btn" aria-label="素材"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 17l6-5 5 4 3-3 4 4"/></svg></button>
    <button class="rail-btn" aria-label="系统"><svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h2M12 12h8M4 18h7M17 18h3"/></svg></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" aria-label="回收站"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></svg></button>
  </aside>

  <div class="shell" id="shell">
    <header class="topbar">
      <div class="crumb">
        <small>工作空间 / 项目</small>
        <strong>白色收纳盒 · 夏日清爽系列 <span>· 画布</span></strong>
      </div>
      <div class="top-actions">
        <div class="seg" role="tablist" aria-label="视图">
          <button class="on" id="tab-canvas" role="tab" aria-selected="true">画布</button>
          <button id="tab-chat" role="tab" aria-selected="false">商品对话</button>
        </div>
        <div class="cost" title="本项目实际用量">本次 <b id="cost">¥0.00</b></div>
        <button class="btn primary" id="run-all">运行全部</button>
        <button class="iconbtn" id="theme" aria-label="切换主题"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></button>
        <div class="avatar">LF</div>
      </div>
    </header>

    <div class="workspace">
      <section class="canvas-wrap" aria-label="创作画布">
        <div class="canvas-scroll" id="scroll">
          <div class="stage" id="stage">
            <svg id="edges" aria-hidden="true"></svg>
            <div id="nodes"></div>
          </div>
        </div>
        <div class="palette" id="palette">
          <h4>添加节点</h4>
        </div>
        <div class="zoombar">
          <button id="zoom-out" aria-label="缩小">−</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in" aria-label="放大">+</button>
          <button id="zoom-fit" aria-label="适应视图"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
        </div>
        <div class="canvas-hint">拖动端口连线 · 双击空白新建生图节点 · Delete 删除选中</div>
      </section>

      <aside class="inspector" aria-label="节点属性">
        <div id="insp"></div>
      </aside>
    </div>

    <section class="queue" aria-label="任务队列">
      <div class="queue-head">
        <h3>任务队列</h3><span class="count" id="run-count">0</span>
        <div class="grow"></div>
        <button class="btn sm ghost" id="retry-all">重试全部失败</button>
        <button class="btn sm ghost" id="clear-done">清除已完成</button>
      </div>
      <div class="queue-scroll">
        <table class="runs">
          <thead><tr><th>节点</th><th>状态</th><th>模型</th><th>耗时</th><th>费用</th><th>错误</th><th></th></tr></thead>
          <tbody id="runs"></tbody>
        </table>
      </div>
    </section>

    <section class="chat" id="chat" aria-label="商品对话">
      <div class="chat-main">
        <div class="chat-top">
          <div class="prod"><div class="pthumb"></div><div><b>白色收纳盒</b><small>资料完整度 78% · 已识别 6 项</small></div></div>
          <div class="grow" style="flex:1"></div>
          <button class="btn primary" id="start-create">开始创作</button>
        </div>
        <div class="chat-log" id="chat-log"></div>
        <div class="composer-wrap">
          <div class="composer">
            <textarea id="msg" rows="1" placeholder="说说商品信息，或贴链接、传截图…"></textarea>
            <div class="crow">
              <button class="iconbtn" title="上传截图" aria-label="上传截图"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3h16v-3"/></svg></button>
              <button class="iconbtn" title="粘贴商品链接" aria-label="粘贴商品链接"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M14 10a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1"/></svg></button>
              <span class="hint">Enter 发送 · Shift+Enter 换行</span>
              <div class="grow"></div>
              <button class="btn primary sm" id="send">发送</button>
            </div>
          </div>
        </div>
      </div>
      <aside class="chat-side">
        <h4>资料完整度</h4>
        <div class="progress-list" id="facts"></div>
        <h4>下一步</h4>
        <div class="plan-card">
          <b>可以开始创作</b>
          <p>AI 会按商品资料生成 6 个节点：2 张主图、2 张场景图、1 张细节图、1 个输出。</p>
          <button class="btn primary" id="start-create-2">生成初始画布</button>
        </div>
        <p class="chat-tip">生成只规划节点，不会自动调用模型；点「运行全部」才产生费用。</p>
      </aside>
    </section>
  </div>
</div>

<script>
(function(){
  const TYPE = {
    product:{label:'商品输入',color:'#F59E0B',ins:[],outs:[{id:'image',type:'image'}],meta:'资料快照 · 6 项'},
    prompt:{label:'提示词',color:'#A78BFA',ins:[],outs:[{id:'text',type:'text'}],meta:'文本 · 可 AI 扩写'},
    image:{label:'图片输入',color:'#38BDF8',ins:[],outs:[{id:'image',type:'image'}],meta:'素材库 · 1 张'},
    generate:{label:'生图',color:'#6366F1',ins:[{id:'prompt',type:'text'},{id:'ref',type:'image'}],outs:[{id:'image',type:'image'}],meta:'gpt-image · 1024'},
    edit:{label:'改图',color:'#8B5CF6',ins:[{id:'image',type:'image'},{id:'prompt',type:'text'}],outs:[{id:'image',type:'image'}],meta:'gpt-image · 原图保留'},
    composite:{label:'合成',color:'#14B8A6',ins:[{id:'images',type:'image',multi:true},{id:'template',type:'text'}],outs:[{id:'image',type:'image'}],meta:'模板 · 3 槽位'},
    video:{label:'视频',color:'#EC4899',ins:[{id:'prompt',type:'text'},{id:'first',type:'image'}],outs:[{id:'video',type:'video'}],meta:'H3 · 6s（未付费验收）'},
    output:{label:'输出',color:'#22C55E',ins:[{id:'asset',type:'image',multi:true}],outs:[],meta:'打包 ZIP'}
  };

  const nodes = [
    {id:'n1',type:'product',x:210,y:150,title:'白色收纳盒',status:'success',prompt:'商品资料快照：名称、价格、卖点、创作素材 3 张'},
    {id:'n2',type:'prompt',x:210,y:400,title:'主图提示词',status:'success',prompt:'白色收纳盒，浅灰背景，柔和顶光，产品居中，电商主图，突出磨砂质感'},
    {id:'n3',type:'generate',x:520,y:120,title:'主图 A',status:'success',prompt:'电商主图 / 1:1 / 1024',model:'gpt-image-1',size:'1024×1024'},
    {id:'n4',type:'edit',x:830,y:120,title:'主图 B · 换背景',status:'failed',prompt:'把背景换成浅木色衣柜，保留产品与阴影',model:'gpt-image-1',size:'1024×1024'},
    {id:'n5',type:'generate',x:520,y:400,title:'场景图 A',status:'running',prompt:'卧室衣柜场景，清晨侧光，生活感',model:'gpt-image-1',size:'1024×1024'},
    {id:'n6',type:'generate',x:520,y:680,title:'细节图',status:'queued',prompt:'磨砂表面特写，浅景深',model:'gpt-image-1',size:'1024×1024'},
    {id:'n7',type:'composite',x:1140,y:250,title:'详情页合成',status:'waiting',prompt:'模板「三图竖排」',model:'—',size:'1242×1660'},
    {id:'n8',type:'output',x:1430,y:250,title:'交付输出',status:'idle',prompt:'成功结果打包',model:'—',size:'—'}
  ];
  const edges = [
    {from:'n1',fp:'image',to:'n3',tp:'ref'},
    {from:'n2',fp:'text',to:'n3',tp:'prompt'},
    {from:'n2',fp:'text',to:'n5',tp:'prompt'},
    {from:'n3',fp:'image',to:'n4',tp:'image'},
    {from:'n3',fp:'image',to:'n7',tp:'images'},
    {from:'n5',fp:'image',to:'n7',tp:'images'},
    {from:'n7',fp:'image',to:'n8',tp:'asset'}
  ];
  let runs = [
    {id:'r1',node:'n3',status:'success',model:'gpt-image-1',dur:'18s',cost:0.42,at:'10:12'},
    {id:'r2',node:'n5',status:'running',model:'gpt-image-1',dur:'6s',cost:0,at:'10:20'},
    {id:'r3',node:'n4',status:'failed',model:'gpt-image-1',dur:'9s',cost:0.08,at:'10:18',error:'上游返回 400：参考图读取失败'},
    {id:'r4',node:'n6',status:'queued',model:'gpt-image-1',dur:'—',cost:0,at:'10:21'}
  ];
  let selected='n3', view='canvas', scale=1;
  const $=s=>document.querySelector(s);
  const stage=$('#stage'), nodesEl=$('#nodes'), svg=$('#edges'), insp=$('#insp');

  function badge(status){
    const m={queued:['排队中','queued'],running:['运行中','running'],success:['成功','success'],failed:['失败','failed'],waiting:['等待输入','waiting'],idle:['未开始','queued'],cancelled:['已取消','queued']};
    const [text,cls]=m[status]||m.idle;
    return `<span class="badge ${cls}">${status==='running'?'<i class="pdot"></i>':''}${text}</span>`;
  }
  function nodeById(id){return nodes.find(n=>n.id===id)}

  function renderNodes(){
    nodesEl.innerHTML = nodes.map(n=>{
      const t=TYPE[n.type];
      const portsIn = t.ins.map((p,i)=>`<div class="port in ${p.type}" data-node="${n.id}" data-port="${p.id}" data-dir="in" style="top:${44+i*24}px"><span>${p.id}</span></div>`).join('');
      const portsOut = t.outs.map((p,i)=>`<div class="port out ${p.type}" data-node="${n.id}" data-port="${p.id}" data-dir="out" style="top:${44+i*24}px"><span>${p.id}</span></div>`).join('');
      const thumb = ['generate','edit','composite','image'].includes(n.type)
        ? `<div class="nthumb">${n.status==='success'?'<span>1024 × 1024</span><span>v3</span>':n.status==='running'?'<span>生成中…</span><span>62%</span>':'<span>尚无结果</span><span>—</span>'}</div>` : '';
      return `<article class="node ${selected===n.id?'sel':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px">
        <header data-drag="${n.id}"><span class="dot" style="--c:${t.color}"></span><span class="nt">${t.label}</span>${badge(n.status)}</header>
        <div class="nbody">${thumb}<div class="nprompt">${n.title}${n.prompt?' · '+n.prompt:''}</div>
          <div class="nmeta">${n.model?`<span class="pill">${n.model}</span>`:''}<span class="pill">${n.size||t.meta}</span></div>
        </div>${portsIn}${portsOut}
      </article>`;
    }).join('');
    requestAnimationFrame(()=>drawEdges());
  }

  function portPos(nodeId, portId, dir){
    const el=document.querySelector(`.port[data-node="${nodeId}"][data-port="${portId}"][data-dir="${dir}"]`);
    if(!el) return null;
    const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect();
    return {x:(r.left+r.width/2-s.left)/scale, y:(r.top+r.height/2-s.top)/scale};
  }
  function drawEdges(temp){
    const s=stage.getBoundingClientRect();
    const all=edges.map((e,i)=>{
      const a=portPos(e.from,e.fp,'out'), b=portPos(e.to,e.tp,'in');
      if(!a||!b) return '';
      const running = nodeById(e.from)?.status==='running' || nodeById(e.to)?.status==='running';
      return `<path class="edge ${running?'run':''} ${selected===e.to||selected===e.from?'hot':''}" d="${curve(a,b)}"/>`;
    }).join('');
    svg.innerHTML=all+(temp?`<path class="edge hot" d="${curve(temp.a,temp.b)}"/>`:'');
  }
  function curve(a,b){
    const dx=Math.max(40,Math.abs(b.x-a.x)*0.5);
    return `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
  }

  function renderInspector(){
    const n=nodeById(selected);
    if(!n){insp.innerHTML='<div class="insp-empty">选择一个节点查看属性</div>';return}
    const t=TYPE[n.type];
    insp.innerHTML=`
      <div class="insp-head"><span class="dot" style="--c:${t.color}"></span><strong>${t.label}</strong>${badge(n.status)}</div>
      <div class="insp-body">
        <div class="field"><label for="f-title">名称</label><input id="f-title" value="${esc(n.title)}"></div>
        <div class="field"><label for="f-prompt">提示词</label><textarea id="f-prompt" rows="4">${esc(n.prompt||'')}</textarea></div>
        <div class="row2">
          <div class="field"><label for="f-model">模型</label><select id="f-model"><option${n.model==='gpt-image-1'?' selected':''}>gpt-image-1</option><option${n.model==='gpt-image-2'?' selected':''}>gpt-image-2</option><option${n.model==='H3'?' selected':''}>H3</option></select></div>
          <div class="field"><label for="f-size">尺寸</label><select id="f-size"><option${n.size==='1024×1024'?' selected':''}>1024×1024</option><option>1242×1660</option><option>1536×1024</option></select></div>
        </div>
        <div class="field"><label>输入</label><div class="nmeta" style="flex-wrap:wrap">${t.ins.length?t.ins.map(p=>`<span class="pill">${p.id} · ${p.type}</span>`).join(''):'<span class="pill">无</span>'}</div></div>
        <details class="adv"><summary>高级参数（JSON）</summary><pre>{
  "quality": "high",
  "background": "opaque",
  "output_format": "png"
}</pre></details>
      </div>
      <div class="insp-actions">
        <button class="btn primary" id="run-node" style="flex:1">运行此节点</button>
        <button class="btn" id="dup-node">复制</button>
        <button class="btn" id="del-node" aria-label="删除">删除</button>
      </div>`;
    $('#f-title').oninput=e=>{n.title=e.target.value;renderNodes();renderRuns()};
    $('#f-prompt').oninput=e=>{n.prompt=e.target.value;renderNodes()};
    $('#f-model').onchange=e=>{n.model=e.target.value;renderNodes()};
    $('#f-size').onchange=e=>{n.size=e.target.value;renderNodes()};
    $('#run-node').onclick=()=>runNode(n.id);
    $('#dup-node').onclick=()=>{const c={...n,id:'n'+Date.now(),x:n.x+40,y:n.y+40,status:'idle'};nodes.push(c);selected=c.id;renderAll()};
    $('#del-node').onclick=()=>{if(n.status==='running'){toast('运行中的节点不能删除');return}nodes.splice(nodes.indexOf(n),1);edges=edges.filter(e=>e.from!==n.id&&e.to!==n.id);selected=nodes[0]?.id||null;renderAll()};
  }
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

  function renderRuns(){
    const rows=runs.map(r=>{
      const n=nodeById(r.node); if(!n) return '';
      const label={queued:'排队中',running:'运行中',success:'成功',failed:'失败',cancelled:'已取消'}[r.status]||r.status;
      return `<tr data-run="${r.id}"><td class="name">${esc(n.title)}</td><td><span class="pill ${r.status}"><i class="d"></i>${label}</span></td>
      <td>${r.model}</td><td>${r.dur}</td><td>${r.cost?('¥'+r.cost.toFixed(2)):'—'}</td>
      <td class="err" title="${esc(r.error||'')}">${esc(r.error||'—')}</td>
      <td>${r.status==='failed'?'<button class="tlink" data-retry="'+r.node+'">重试</button>':r.status==='running'?'<button class="tlink" data-cancel="'+r.id+'">取消</button>':''}</td></tr>`;
    }).join('');
    $('#runs').innerHTML=rows||'<tr><td colspan="7" style="text-align:center;color:var(--fg-mute);padding:18px">还没有运行记录</td></tr>';
    $('#run-count').textContent=runs.filter(r=>r.status==='running'||r.status==='queued').length+' 执行中';
    const total=runs.reduce((a,r)=>a+r.cost,0);
    $('#cost').textContent='¥'+total.toFixed(2);
    document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=e=>{e.stopPropagation();runNode(b.dataset.retry,true)});
    document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=e=>{e.stopPropagation();cancelRun(b.dataset.cancel)});
    document.querySelectorAll('#runs tr[data-run]').forEach(tr=>tr.onclick=()=>{const r=runs.find(x=>x.id===tr.dataset.run);if(r){selected=r.node;renderAll();scrollToNode(r.node)}});
  }

  function runNode(id,retry){
    const n=nodeById(id); if(!n) return;
    if(n.status==='running'){toast('该节点正在运行');return}
    if(n.type==='output'&&nodes.some(x=>x.type!=='output'&&x.status!=='success')){toast('还有节点未成功，输出会在全部成功后可用');return}
    n.status='queued'; selected=id; renderAll();
    const run={id:'r'+Date.now(),node:id,status:'queued',model:n.model||'gpt-image-1',dur:'—',cost:0,at:now(),error:''};
    runs.unshift(run); renderRuns();
    setTimeout(()=>{run.status='running';n.status='running';run.dur='1s';renderAll()},450);
    const dur=1800+Math.random()*1800;
    setTimeout(()=>{
      const fails=Math.random()<0.18;
      run.status=fails?'failed':'success'; n.status=fails?'failed':'success';
      run.dur=Math.round(dur/1000)+'s'; run.cost=fails?0.05:+(0.24+Math.random()*0.4).toFixed(2);
      if(fails) run.error='上游返回 429：并发超限，请稍后重试';
      renderAll();
    },dur);
  }
  function cancelRun(rid){const r=runs.find(x=>x.id===rid);if(!r)return;r.status='cancelled';r.dur='—';const n=nodeById(r.node);if(n)n.status='idle';renderAll()}
  function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

  function renderPalette(){
    const order=['product','prompt','image','generate','edit','composite','video','output'];
    $('#palette').innerHTML='<h4>添加节点</h4>'+order.map(t=>`<button class="pal-btn" data-add="${t}"><i style="--c:${TYPE[t].color}"></i>${TYPE[t].label}</button>`).join('');
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addNode(b.dataset.add));
  }
  function addNode(type){
    const n={id:'n'+Date.now(),type,x:320+Math.random()*120,y:520+Math.random()*80,title:TYPE[type].label,status:'idle',prompt:'',model:type==='video'?'H3':'gpt-image-1',size:'1024×1024'};
    nodes.push(n);selected=n.id;renderAll();scrollToNode(n.id);
  }
  function scrollToNode(id){const n=nodeById(id);if(!n)return;$('#scroll').scrollTo({left:Math.max(0,n.x-120),top:Math.max(0,n.y-80),behavior:'smooth'})}

  // drag nodes
  let drag=null;
  nodesEl.addEventListener('pointerdown',e=>{
    const h=e.target.closest('[data-drag]'); if(!h) return;
    const id=h.dataset.drag; selected=id; renderAll();
    const n=nodeById(id); const s=stage.getBoundingClientRect();
    drag={id,ox:(e.clientX-s.left)/scale-n.x,oy:(e.clientY-s.top)/scale-n.y};
    h.setPointerCapture(e.pointerId);
  });
  nodesEl.addEventListener('pointermove',e=>{
    if(!drag) return;
    const s=stage.getBoundingClientRect(); const n=nodeById(drag.id);
    n.x=Math.round((e.clientX-s.left)/scale-drag.ox); n.y=Math.round((e.clientY-s.top)/scale-drag.oy);
    const el=document.querySelector(`.node[data-id="${drag.id}"]`); if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}
    drawEdges();
  });
  nodesEl.addEventListener('pointerup',()=>{drag=null});

  // connections
  let connect=null;
  nodesEl.addEventListener('pointerdown',e=>{
    const p=e.target.closest('.port.out'); if(!p) return;
    e.stopPropagation();
    const a=portPos(p.dataset.node,p.dataset.port,'out');
    connect={node:p.dataset.node,port:p.dataset.port,type:[...p.classList].includes('text')?'text':[...p.classList].includes('video')?'video':'image',a,b:a};
    svg.style.pointerEvents='none';
    window.addEventListener('pointermove',onConnectMove);
    window.addEventListener('pointerup',onConnectUp,{once:true});
  });
  function onConnectMove(e){
    if(!connect) return;
    const s=stage.getBoundingClientRect();
    connect.b={x:(e.clientX-s.left)/scale,y:(e.clientY-s.top)/scale};
    drawEdges({a:connect.a,b:connect.b});
  }
  function onConnectUp(e){
    window.removeEventListener('pointermove',onConnectMove);
    if(!connect) return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const port=el&&el.closest('.port.in');
    if(port&&port.dataset.node!==connect.node){
      const tType=[...port.classList].includes('text')?'text':[...port.classList].includes('video')?'video':'image';
      if(tType!==connect.type){toast('端口类型不匹配：'+connect.type+' → '+tType)}
      else{
        const dup=edges.some(x=>x.from===connect.node&&x.fp===connect.port&&x.to===port.dataset.node&&x.tp===port.dataset.port);
        if(dup) toast('这两个端口已经连过了');
        else{edges.push({from:connect.node,fp:connect.port,to:port.dataset.node,tp:port.dataset.port});toast('已连接 '+connect.type)}
      }
    }
    connect=null; renderAll();
  }

  // delete key
  window.addEventListener('keydown',e=>{
    if(e.key==='Delete'&&selected&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
      const n=nodeById(selected); if(!n) return;
      if(n.status==='running'){toast('运行中的节点不能删除');return}
      nodes.splice(nodes.indexOf(n),1); edges=edges.filter(x=>x.from!==n.id&&x.to!==n.id); selected=null; renderAll();
    }
  });

  // zoom
  function setScale(z){scale=Math.min(1.5,Math.max(.4,z));stage.style.transform=`scale(${scale})`;$('#zoom-label').textContent=Math.round(scale*100)+'%';requestAnimationFrame(()=>drawEdges())}
  $('#zoom-in').onclick=()=>setScale(scale+.1);
  $('#zoom-out').onclick=()=>setScale(scale-.1);
  $('#zoom-fit').onclick=()=>{const w=$('.canvas-scroll').clientWidth,h=$('.canvas-scroll').clientHeight;setScale(Math.min((w-80)/1500,(h-80)/900))};

  // double click canvas = new generate
  $('.canvas-scroll').addEventListener('dblclick',e=>{
    if(e.target.closest('.node')) return;
    const s=stage.getBoundingClientRect();
    const n={id:'n'+Date.now(),type:'generate',x:(e.clientX-s.left)/scale-125,y:(e.clientY-s.top)/scale-30,title:'新生成',status:'idle',prompt:'',model:'gpt-image-1',size:'1024×1024'};
    nodes.push(n);selected=n.id;renderAll();
  });

  // top actions
  $('#run-all').onclick=()=>{
    const pending=nodes.filter(n=>n.status!=='success'&&n.status!=='running');
    if(!pending.length){toast('所有节点都已成功');return}
    pending.forEach((n,i)=>setTimeout(()=>runNode(n.id),i*350));
  };
  $('#retry-all').onclick=()=>{const failed=runs.filter(r=>r.status==='failed');if(!failed.length){toast('没有失败任务');return}failed.forEach((r,i)=>setTimeout(()=>runNode(r.node,true),i*300))};
  $('#clear-done').onclick=()=>{runs=runs.filter(r=>r.status!=='success'&&r.status!=='cancelled');renderRuns()};

  // chat
  const messages=[
    {who:'ai',text:'你好，我是商品资料助手。把商品链接、截图或已知信息发给我，我来整理成结构化的商品档案。'},
    {who:'me',text:'白色磨砂收纳盒，带盖，尺寸 30×20×15cm，卖点是防尘和可叠放，价格 39.9。',facts:['名称 白色收纳盒','价格 ¥39.9','尺寸 30×20×15','卖点 防尘 / 可叠放']},
    {who:'ai',text:'收到。我补两个问题：<b>材质</b>是 PP 还是亚克力？主要用在<b>衣柜</b>还是<b>桌面</b>？这会影响主图背景。'},
    {who:'me',text:'PP 材质，主要放衣柜。',facts:['材质 PP','场景 衣柜']}
  ];
  function renderChat(){
    $('#chat-log').innerHTML=messages.map(m=>`<div class="msg ${m.who}"><div class="who">${m.who==='ai'?'AI':'你'}</div><div class="bubble">${m.text}${m.facts?`<div class="facts">${m.facts.map(f=>{const [k,...v]=f.split(' ');return `<span class="fact"><em>${k}</em>${v.join(' ')}</span>`}).join('')}</div>`:''}</div></div>`).join('');
    $('#chat-log').scrollTop=$('#chat-log').scrollHeight;
  }
  function send(){
    const el=$('#msg'); const text=el.value.trim(); if(!text) return;
    messages.push({who:'me',text:esc(text)}); el.value=''; el.style.height='auto'; renderChat();
    setTimeout(()=>{
      messages.push({who:'ai',text:'已记下。资料已经够开始创作了，点右上角「开始创作」，我会按商品生成初始画布，不会自动生图。'});
      renderChat();
    },700);
  }
  $('#send').onclick=send;
  $('#msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  $('#msg').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'});
  function showCanvas(){view='canvas';$('#shell').classList.remove('is-chat');$('#tab-canvas').classList.add('on');$('#tab-chat').classList.remove('on');requestAnimationFrame(()=>drawEdges())}
  function showChat(){view='chat';$('#shell').classList.add('is-chat');$('#tab-chat').classList.add('on');$('#tab-canvas').classList.remove('on')}
  $('#tab-canvas').onclick=showCanvas; $('#tab-chat').onclick=showChat;
  $('#start-create').onclick=()=>{showCanvas();toast('已按商品生成 8 个节点，运行前可自由调整')};
  $('#start-create-2').onclick=$('#start-create').onclick;

  // theme
  $('#theme').onclick=()=>{
    const root=document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme==='dark' : !matchMedia('(prefers-color-scheme: light)').matches;
    root.dataset.theme=dark?'light':'dark';
  };

  // toast
  let toastTimer;
  function toast(text){
    let el=document.getElementById('toast');
    if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--surface-3);color:var(--fg);border:1px solid var(--line);padding:8px 14px;border-radius:9px;font-size:12px;z-index:99;box-shadow:var(--shadow);opacity:0;transition:opacity .15s';document.body.appendChild(el)}
    el.textContent=text;el.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity='0',2200);
  }

  function renderAll(){renderNodes();renderInspector();renderRuns();requestAnimationFrame(()=>drawEdges())}
  renderPalette();renderAll();renderChat();setScale(window.innerWidth<=900?0.55:1);
  document.getElementById('facts').innerHTML=[['名称','白色收纳盒'],['价格','¥39.9'],['尺寸','30×20×15cm'],['材质','PP'],['卖点','防尘 / 可叠放'],['场景','衣柜']].map(([k,v])=>`<div class="pitem"><span class="ok fill">✓</span><span><em style="font-style:normal;color:var(--fg-mute);margin-right:6px">${k}</em>${v}</span></div>`).join('')+'<div class="pitem"><span class="ok"></span><span style="color:var(--fg-mute)">目标人群（待补充）</span></div>';
  // open at a readable part of the graph
  $('#scroll').scrollLeft=20; $('#scroll').scrollTop=20;
})();
</script>
