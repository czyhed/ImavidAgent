# 商境独立 vhost（宝塔 nginx 1.30）
# 安装位置：/www/server/panel/vhost/nginx/shangjing-app.conf
# 端口 8443，不占用宝塔现有 443 vhost；公网需在 UFW 放行 8443/tcp。
# 证书由项目私有 CA 签发，部署时用 tls-issue.sh 生成，浏览器需信任该 CA。
# 反向代理到仅监听宿主回环的应用 127.0.0.1:4173。

server {
    listen 8443 ssl;
    http2 on;
    server_name 203.0.113.10 203.0.113.11;

    ssl_certificate     /opt/shangjing-app/tls/server.crt;
    ssl_certificate_key /opt/shangjing-app/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:shangjing_app_ssl:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server_tokens off;

    # 创作素材上传最多 100 MB；图片由应用另行校验 10 MB 上限。
    client_max_body_size 100m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # 页面 CSP 由 Node 服务下发，这里不重复设置，避免覆盖应用策略。

    access_log /www/wwwlogs/shangjing-app.access.log;
    error_log  /www/wwwlogs/shangjing-app.error.log;

    # 首次管理员初始化只允许直连服务器回环（SSH 隧道访问 127.0.0.1:4173）完成。
    # nginx 到应用的连接来源恒为 127.0.0.1，allow/deny 无法区分真实客户端，
    # 因此这里直接拒绝所有经代理的初始化请求；应用自身也会拒绝带转发头的请求。
    location = /api/setup/admin {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        # 保留浏览器 Host 中的端口，应用白名单按 host:port 精确比较。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";

        # 生图任务靠浏览器轮询状态，关闭缓冲避免长响应被 nginx 攒住。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_socket_keepalive on;
    }
}
