bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /etc/redis/users.acl
dir /data
appendonly yes
appendfsync everysec
maxmemory 512mb
maxmemory-policy noeviction
save 900 1
save 300 10
save 60 10000
